      type: "string"
      enum:
      - "CANCELLED"
      - "ERROR"
      - "PAUSED"
      - "RUNNING"
      - "SUCCESS"
      - "UNKNOWN"
    Task:
      properties:
        name:
          nullable: true
          type: "string"
        action:
          example: "my.app:action_1"
          pattern: "^.+:.+$"
          type: "string"
        description:
          nullable: true
          type: "string"
        input:
          additionalProperties: true
          nullable: true
          type: "object"
        active:
          anyOf:
          - type: "boolean"
          - type: "string"
          default: true
          description: "Specifies whether a task should be skipped as a no operation\
            \ or not."
        position:
          anyOf:
          - $ref: "#/components/schemas/TaskPosition"
          nullable: true
        customSampleResult: {}
        predecessors:
          items:
            type: "string"
          nullable: true
          type: "array"
          uniqueItems: true
        conditions:
          anyOf:
          - $ref: "#/components/schemas/TaskConditionOption"
          nullable: true
        withItems:
          nullable: true
          type: "string"
        concurrency:
          anyOf:
          - pattern: "^{{.+}}$"
            type: "string"
          - maximum: 99
            minimum: 1
            type: "integer"
        retry:
          anyOf:
          - $ref: "#/components/schemas/TaskRetryOption"
          nullable: true
        timeout:
          anyOf:
          - pattern: "^{{.+}}$"
            type: "string"
          - maximum: 604800
            minimum: 1
            type: "integer"
          default: 3600
          description: "Specifies a default task timeout. 60 * 60 (60min) is used\
            \ when not set."
        waitBefore:
          anyOf:
          - pattern: "^{{.+}}$"
            type: "string"
          - maximum: 86400
            minimum: 0
            type: "integer"
          default: 0
          description: "Specifies a default task wait before in seconds. 0 is used\
            \ when not set."
      required:
      - "action"
      title: "Task"
      type: "object"
    TaskConditionOption:
      properties:
        states:
          additionalProperties:
            enum:
            - "SUCCESS"
            - "ERROR"
            - "ANY"
            - "OK"
            - "NOK"
            type: "string"
          nullable: true
          type: "object"
        custom:
          nullable: true
          type: "string"
        else:
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/Else"
      title: "TaskConditionOption"
      type: "object"
    TaskPosition:
      properties:
        x:
          maximum: 1000
          minimum: -1000
          type: "integer"
        "y":
          maximum: 1000
          minimum: 1
          type: "integer"
      required:
      - "x"
      - "y"
      title: "TaskPosition"
      type: "object"
    TaskRetryOption:
      properties:
        count:
          anyOf:
          - pattern: "^{{.+}}$"
            type: "string"
          - maximum: 99
            minimum: 0
            type: "integer"
          description: "Specifies a maximum number of times that a task can be repeated\
            \ in case it fails on execution."
        delay:
          anyOf:
          - pattern: "^{{.+}}$"
            type: "string"
          - maximum: 3600
            minimum: 0
            type: "integer"
          description: "Specifies a delay in seconds between subsequent task retries"
        failedLoopIterationsOnly:
          default: true
          description: "Specifies whether retrying the failed iterations or the whole\
            \ loop. Default: True."
          type: "boolean"
      required:
      - "count"
      title: "TaskRetryOption"
      type: "object"

openapi: "3.0.3"
info:
  title: "Reserved Automation"
  version: "1.4018.0"
  description: "Reserved Automation API is intended for integration with dynatrace.automations\
    \ app"
paths:
  /approvals/{executionId}/tasks/{taskName}/approve:
    post:
      operationId: "approveTaskApproval"
      description: "**Required scope:** automation:workflows:run<br/><br/>Approve\
        \ an approval request."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "path"
        name: "taskName"
        schema:
          type: "string"
        required: true
      tags:
      - "approvals"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInputRequest"
        required: true
      security:
      - client_credentials:
        - "automation:workflows:run"
      - ssoBearerAuth: []
      responses:
        "204":
          description: "No response body"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /approvals/{executionId}/tasks/{taskName}/decline:
    post:
      operationId: "declineTaskApproval"
      description: "**Required scope:** automation:workflows:run<br/><br/>Decline\
        \ an approval request."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "path"
        name: "taskName"
        schema:
          type: "string"
        required: true
      tags:
      - "approvals"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInputRequest"
        required: true
      security:
      - client_credentials:
        - "automation:workflows:run"
      - ssoBearerAuth: []
      responses:
        "204":
          description: "No response body"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /approvals/{executionId}/tasks/{taskName}/view:
    post:
      operationId: "viewTaskApproval"
      description: "**Required scope:** automation:workflows:run<br/><br/>View an\
        \ approval request."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "executionId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "path"
        name: "taskName"
        schema:
          type: "string"
        required: true
      tags:
      - "approvals"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalInputRequest"
        required: true
      security:
      - client_credentials:
        - "automation:workflows:run"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /event-triggers/filter-query/execute:
    post:
      operationId: "executeQueryAsActor"
      description: "**Required scope:** automation:workflows:write<br/><br/>Run DQL\
        \ query in the context of an actor (service user)."
      tags:
      - "event-triggers"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteQueryAsActorRequest"
        required: true
      security:
      - client_credentials:
        - "automation:workflows:write"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /expression-preview:
    post:
      operationId: "previewExpression"
      description: "**Required scope:** automation:workflows:read<br/><br/>Returns\
        \ preview expression by given task id from the workflow definition"
      tags:
      - "expression-preview"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpressionPreviewRequest"
        required: true
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpressionPreviewResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /schedules/preview:
    post:
      operationId: "previewSchedule"
      tags:
      - "schedules"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePreviewRequest"
        required: true
      security:
      - client_credentials:
        - "app-engine:apps:run"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePreviewResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** app-engine:apps:run"
  /scheduling-rules/preview:
    post:
      operationId: "previewRule"
      tags:
      - "scheduling-rules"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulePreviewCreate"
        required: true
      security:
      - client_credentials:
        - "app-engine:apps:run"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulePreviewResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** app-engine:apps:run"
  /schedules/holiday-calendars:
    get:
      operationId: "getCountries"
      description: "**Required scope:** app-engine:apps:run<br/><br/>Returns the list\
        \ of countries that can be used to look up the holiday calendar"
      tags:
      - "schedules"
      security:
      - client_credentials:
        - "app-engine:apps:run"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryList"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /schedules/holiday-calendars/{key}:
    get:
      operationId: "getHolidayCalendar"
      parameters:
      - in: "query"
        name: "from"
        schema:
          type: "string"
          format: "date"
        description: "From date in ISO format"
        required: true
      - in: "path"
        name: "key"
        schema:
          type: "string"
        description: "The country name"
        required: true
      - in: "query"
        name: "to"
        schema:
          type: "string"
          format: "date"
        description: "To date in ISO format"
        required: true
      tags:
      - "schedules"
      security:
      - client_credentials:
        - "app-engine:apps:run"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HolidayCalendarList"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** app-engine:apps:run"
  /schedules/timezones:
    get:
      operationId: "getTimezones"
      tags:
      - "schedules"
      security:
      - client_credentials:
        - "app-engine:apps:run"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "string"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** app-engine:apps:run"
  /settings:
    get:
      operationId: "getSettings"
      description: "**Required scope:** automation:workflows:read<br/><br/>Get system\
        \ settings"
      tags:
      - "settings"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /settings/authorizations-update:
    post:
      operationId: "updateAuthorizations"
      tags:
      - "settings"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "202":
          description: "No response body"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /settings/service-users:
    get:
      operationId: "getServiceUsers"
      description: "**Required scope:** automation:workflows:read<br/><br/>Get service\
        \ users who could be used as workflow actor (deprecated)."
      tags:
      - "settings"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                additionalProperties: {}
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /settings/user:
    get:
      operationId: "getUserSettings"
      description: "**Required scope:** automation:workflows:read<br/><br/>Get user-specific\
        \ settings"
      tags:
      - "settings"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /settings/user-permissions:
    get:
      operationId: "getUserPermissions"
      description: "**Required scope:** automation:workflows:read<br/><br/>Get current\
        \ user effective permissions."
      tags:
      - "settings"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "array"
                items:
                  type: "string"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /workflow-usages/{workflowId}:
    get:
      operationId: "getWorkflowUsages"
      description: "**Required scope:** automation:workflows:read<br/><br/>Get workflow\
        \ usages based on given workflow id"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "query"
        name: "limit"
        schema:
          type: "integer"
          format: "int32"
          default: 20
        description: "Number of results to return per page."
      - in: "query"
        name: "offset"
        schema:
          type: "integer"
          format: "int32"
          default: 0
        description: "The initial index from which to return the results."
      - in: "path"
        name: "workflowId"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "workflow-usages"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowUsageResponse"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /minimal-workflows:
    get:
      operationId: "getMinimalWorkflows"
      description: "**Required scope:** automation:workflows:read<br/><br/>Returns\
        \ a minimal workflow list with only essential fields. Optimized for performance\
        \ with small payloads and no expensive joins."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "query"
        required: false
        name: "offset"
        schema:
          type: "integer"
        description: "The initial index from which to return the results."
      - in: "query"
        required: false
        name: "limit"
        schema:
          type: "integer"
        description: "Number of results per page"
      - in: "query"
        name: "ordering"
        schema:
          type: "string"
        description: "Order results by field (prefix with - for descending order)"
      - in: "query"
        name: "type"
        schema:
          $ref: "#/components/schemas/WorkflowType"
        description: "Filter by workflow type"
      - in: "query"
        name: "isDeployed"
        schema:
          type: "boolean"
        description: "Filter by deployment status"
      - in: "query"
        name: "triggerType"
        schema:
          $ref: "#/components/schemas/TriggerType"
      - in: "query"
        name: "unacknowledgedSkippedScheduleAt__lte"
        schema:
          type: "string"
          format: "date-time"
        description: "Filter workflows with unacknowledged skipped schedule at or\
          \ before this time"
      - in: "query"
        name: "unacknowledgedSkippedScheduleAt__gte"
        schema:
          type: "string"
          format: "date-time"
        description: "Filter workflows with unacknowledged skipped schedule at or\
          \ after this time"
      - in: "query"
        name: "search"
        schema:
          type: "string"
        description: "Search workflows by title"
      - in: "query"
        name: "ownerType"
        schema:
          $ref: "#/components/schemas/OwnerType"
        description: "Filter by owner type"
      - in: "query"
        name: "owner"
        schema:
          type: "string"
        description: "Filter by owner ID"
      tags:
      - "workflows"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedWorkflowMinimalList"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /minimal-workflows/{id}:
    get:
      operationId: "getMinimalWorkflow"
      parameters:
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        description: "A UUID string identifying this workflow."
        required: true
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      tags:
      - "workflows"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowMinimal"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /workflows/{id}/draft:
    get:
      operationId: "getWorkflowDraft"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "workflows"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDraft"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
    put:
      operationId: "createOrUpdateWorkflowDraft"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "workflows"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDraftUpdate"
        required: true
      security:
      - client_credentials:
        - "automation:workflows:write"
      - ssoBearerAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDraft"
          description: "Workflow draft has been created"
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDraft"
          description: "Workflow draft has been updated"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:write"
    delete:
      operationId: "deleteWorkflowDraft"
      description: "**Required scope:** automation:workflows:write<br/><br/>Delete\
        \ the workflow draft. If the workflow is undeployed, it will be deleted as\
        \ well."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "workflows"
      security:
      - client_credentials:
        - "automation:workflows:write"
      - ssoBearerAuth: []
      responses:
        "204":
          description: "No response body"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
  /workflows/{id}/draft/deploy:
    post:
      operationId: "deployWorkflowDraft"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "workflows"
      security:
      - client_credentials:
        - "automation:workflows:write"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDraft"
          description: "Workflow has been deployed successfully."
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:write"
  /workflows/{id}/draft/export:
    get:
      operationId: "exportWorkflowDraft"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "workflows"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExport"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /workflows/{id}/draft/template:
    get:
      operationId: "exportWorkflowDraftTemplate"
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        required: true
      tags:
      - "workflows"
      security:
      - client_credentials:
        - "automation:workflows:read"
      - ssoBearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowTemplate"
          description: ""
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
      description: "**Required scope:** automation:workflows:read"
  /workflows/{id}/draft/run:
    post:
      operationId: "runWorkflow"
      description: "**Required scope:** automation:workflows:run<br/><br/>Creates\
        \ an Execution for the Workflow."
      parameters:
      - in: "query"
        name: "adminAccess"
        schema:
          type: "boolean"
          default: false
        description: "Allow access to all workflows/executions - additionally requires\
          \ **automation:workflows:admin**"
      - in: "path"
        name: "id"
        schema:
          type: "string"
          format: "uuid"
        required: true
      - in: "query"
        name: "monitor"
        schema:
          type: "boolean"
          default: false
        description: "Specifies whether the execution data of the SIMPLE workflow\
          \ type is available for monitoring until the execution is complete."
      tags:
      - "workflows"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionInputsRequest"
            examples:
              ExecutionInputsRequest:
                value:
                  input: {}
                  params: {}
        required: true
      security:
      - client_credentials:
        - "automation:workflows:run"
      - ssoBearerAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
          description: "Execution successfully created"
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
          description: "No execution created - execution with uniqueQualifier provided\
            \ already exists"
        "4XX":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: ""
components:
  schemas:
    Approval:
      type: "object"
      properties:
        workflowId:
          type: "string"
          format: "uuid"
          readOnly: true
        workflowVersion:
          type: "string"
          readOnly: true
        executionId:
          type: "string"
          format: "uuid"
          readOnly: true
        executionTitle:
          type: "string"
          readOnly: true
        taskName:
          type: "string"
          readOnly: true
        state:
          type: "string"
          readOnly: true
        errorReason:
          type: "string"
          readOnly: true
          nullable: true
        endedAt:
          type: "string"
          format: "date-time"
          readOnly: true
          nullable: true
        timeoutAt:
          type: "string"
          format: "date-time"
          readOnly: true
        message:
          type: "string"
        responseUser:
          type: "string"
          nullable: true
          maxLength: 255
        responseTime:
          type: "string"
          format: "date-time"
          nullable: true
        externalApprover:
          type: "string"
          nullable: true
          maxLength: 255
      required:
      - "endedAt"
      - "errorReason"
      - "executionId"
      - "executionTitle"
      - "state"
      - "taskName"
      - "timeoutAt"
      - "workflowId"
      - "workflowVersion"
    ApprovalInputRequest:
      properties:
        nonce:
          description: "An optional nonce to view, approve, or decline the approval\
            \ request."
          nullable: true
          type: "string"
      title: "ApprovalInputRequest"
      type: "object"
    BasedOnTemplate:
      properties:
        trackingId:
          maxLength: 36
          minLength: 1
          type: "string"
        originAppId:
          nullable: true
          type: "string"
        version:
          maxLength: 10
          nullable: true
          type: "string"
        title:
          maxLength: 200
          nullable: true
          type: "string"
      required:
      - "trackingId"
      title: "BasedOnTemplate"
      type: "object"
    Byday:
      enum:
      - "MO"
      - "TU"
      - "WE"
      - "TH"
      - "FR"
      - "SA"
      - "SU"
      type: "string"
    Byworkday:
      description: "The type of days on which the recurrence will be applied."
      enum:
      - "WORKING"
      - "HOLIDAYS"
      - "OFF"
      type: "string"
    Country:
      properties:
        id:
          type: "string"
        title:
          type: "string"
      required:
      - "id"
      - "title"
      title: "Country"
      type: "object"
    CountryList:
      properties:
        count:
          type: "integer"
        results:
          items:
            $ref: "#/components/schemas/Country"
          type: "array"
      required:
      - "count"
      - "results"
      title: "CountryList"
      type: "object"
    CronTrigger:
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/CronTriggerType"
        cron:
          example: "0 0 * * *"
          type: "string"
      required:
      - "type"
      - "cron"
      title: "CronTrigger"
      type: "object"
    CronTriggerType:
      enum:
      - "cron"
      type: "string"
    DavisEventConfig:
      additionalProperties: false
      properties:
        entityTagsMatch:
          anyOf:
          - $ref: "#/components/schemas/EntityTagsMatch"
          nullable: true
        entityTags:
          anyOf:
          - $ref: "#/components/schemas/EntityTags"
          nullable: true
        onProblemClose:
          default: false
          description: "Trigger on Davis event open only or also on close."
          type: "boolean"
        names:
          items:
            $ref: "#/components/schemas/DavisEventName"
          nullable: true
          type: "array"
          uniqueItems: true
        types:
          deprecated: true
          items:
            type: "string"
          nullable: true
          type: "array"
          uniqueItems: true
        customFilter:
          default: ""
          description: "Additional DQL matcher expression to further filter events\
            \ to match."
          nullable: true
          type: "string"
        maintenanceWindowTriggerBehavior:
          default: "always"
          anyOf:
          - $ref: "#/components/schemas/MaintenanceWindowTriggerBehaviorType"
      title: "DavisEventConfig"
      type: "object"
    DavisEventName:
      additionalProperties: false
      properties:
        match:
          $ref: "#/components/schemas/DavisEventNameMatch"
        name:
          type: "string"
      required:
      - "match"
      - "name"
      title: "DavisEventName"
      type: "object"
    DavisEventNameMatch:
      title: "DavisEventNameMatch"
      type: "string"
      enum:
      - "equals"
      - "contains"
      description: "Davis event name must equal or contain the string provided."
    DavisEventTriggerConfig:
      additionalProperties: false
      example:
        type: "davis-event"
        value:
          entityTags:
            environment:
            - "production"
            service:
            - "database"
          entityTagsMatch: "all"
          maintenanceWindowTriggerBehavior: "always"
          names:
          - match: "equals"
            name: "CUSTOM_ALERT"
          onProblemClose: false
      properties:
        type:
          $ref: "#/components/schemas/DavisEventTriggerConfigType"
        value:
          $ref: "#/components/schemas/DavisEventConfig"
      required:
      - "type"
      - "value"
      title: "DavisEventTriggerConfig"
      type: "object"
    DavisEventTriggerConfigType:
      enum:
      - "davis-event"
      type: "string"
    DavisProblemCategories:
      additionalProperties: false
      properties:
        monitoringUnavailable:
          default: false
          type: "boolean"
        availability:
          default: false
          type: "boolean"
        error:
          default: false
          type: "boolean"
        slowdown:
          default: false
          type: "boolean"
        resource:
          default: false
          type: "boolean"
        custom:
          default: false
          type: "boolean"
        info:
          default: false
          type: "boolean"
      title: "DavisProblemCategories"
      type: "object"
    DavisProblemConfig:
      additionalProperties: false
      properties:
        entityTagsMatch:
          anyOf:
          - $ref: "#/components/schemas/EntityTagsMatch"
          nullable: true
        entityTags:
          anyOf:
          - $ref: "#/components/schemas/EntityTags"
          nullable: true
        onProblemClose:
          default: false
          description: "Trigger on Davis problem open only or also on close."
          type: "boolean"
        categories:
          $ref: "#/components/schemas/DavisProblemCategories"
        customFilter:
          default: ""
          description: "Additional DQL matcher expression to further filter events\
            \ to match."
          nullable: true
          type: "string"
        analysisReady:
          default: false
          description: "Run only after first root cause analysis run completed."
          type: "boolean"
        severityThreshold:
          description: "Triggers only for problems whose severity is this value or\
            \ more severe. Lower numbers are more severe (1 = critical, 5 = informational),\
            \ so 3 matches severities 1, 2, and 3."
          maximum: 5
          minimum: 1
          nullable: true
          type: "integer"
      required:
      - "categories"
      title: "DavisProblemConfig"
      type: "object"
    DavisProblemTriggerConfig:
      additionalProperties: false
      example:
        type: "davis-problem"
        value:
          analysisReady: false
          categories:
            availability: false
            custom: false
            error: true
            info: false
            monitoringUnavailable: false
            resource: false
            slowdown: false
          entityTags:
            environment:
            - "production"
          entityTagsMatch: "all"
          onProblemClose: false
          severityThreshold: 3
      properties:
        type:
          $ref: "#/components/schemas/DavisProblemTriggerConfigType"
        value:
          $ref: "#/components/schemas/DavisProblemConfig"
      required:
      - "type"
      - "value"
      title: "DavisProblemTriggerConfig"
      type: "object"
    DavisProblemTriggerConfigType:
      enum:
      - "davis-problem"
      type: "string"
    Direction:
      enum:
      - "next"
      - "previous"
      type: "string"
    Else:
      enum:
      - "SKIP"
      - "STOP"
      type: "string"
    EntityTags:
      additionalProperties:
        anyOf:
        - type: "string"
        - items:
            type: "string"
          type: "array"
      description: "Entity tags to match by key and (optional) values. For example\
        \ {\"foo\": [], \"bar\": [\"a\", \"b\", \"c\"]}"
      title: "EntityTags"
      type: "object"
    EntityTagsMatch:
      title: "EntityTagsMatch"
      type: "string"
      enum:
      - "all"
      - "any"
      description: "Event must match all or any of the entity tags."
    EnvironmentObject:
      properties:
        id:
          type: "string"
        workflowsCount:
          type: "integer"
        workflowsLimit:
          type: "integer"
        limits:
          $ref: "#/components/schemas/ExecutionLimits"
      required:
      - "id"
      - "workflowsCount"
      - "limits"
      title: "EnvironmentObject"
      type: "object"
    Error:
      properties:
        message:
          type: "string"
        code:
          type: "integer"
        details:
          $ref: "#/components/schemas/ErrorDetails"
      required:
      - "message"
      - "code"
      title: "Error"
      type: "object"
    ErrorDetails:
      additionalProperties: true
      properties:
        errorCode:
          type: "string"
        errorRef:
          type: "string"
      title: "ErrorDetails"
      type: "object"
    ErrorEnvelope:
      properties:
        error:
          $ref: "#/components/schemas/Error"
      required:
      - "error"
      title: "ErrorEnvelope"
      type: "object"
    EventQuery:
      additionalProperties: false
      properties:
        query:
          description: "DQL matcher expression defining which events to match."
          maxLength: 1000
          minLength: 1
          type: "string"
        eventType:
          $ref: "#/components/schemas/EventType"
      required:
      - "query"
      title: "EventQuery"
      type: "object"
    EventQueryTriggerConfig:
      additionalProperties: false
      example:
        type: "event"
        value:
          eventType: "bizevents"
          query: "event.kind == \"CUSTOM_KIND\""
      properties:
        type:
          $ref: "#/components/schemas/EventQueryTriggerConfigType"
        value:
          $ref: "#/components/schemas/EventQuery"
      required:
      - "type"
      - "value"
      title: "EventQueryTriggerConfig"
      type: "object"
    EventQueryTriggerConfigType:
      enum:
      - "event"
      type: "string"
    EventTrigger:
      type: "object"
      properties:
        isActive:
          type: "boolean"
        filterQuery:
          type: "string"
          readOnly: true
        uniqueExpression:
          type: "string"
          readOnly: true
          nullable: true
        triggerConfiguration:
          $ref: "#/components/schemas/EventTriggerConfig"
      required:
      - "filterQuery"
      - "uniqueExpression"
    EventTriggerConfig:
      discriminator:
        mapping:
          davis-event: "#/components/schemas/DavisEventTriggerConfig"
          davis-problem: "#/components/schemas/DavisProblemTriggerConfig"
          event: "#/components/schemas/EventQueryTriggerConfig"
        propertyName: "type"
      oneOf:
      - $ref: "#/components/schemas/EventQueryTriggerConfig"
      - $ref: "#/components/schemas/DavisProblemTriggerConfig"
      - $ref: "#/components/schemas/DavisEventTriggerConfig"
      title: "EventTriggerConfig"
    EventTriggerExport:
      type: "object"
      properties:
        isActive:
          type: "boolean"
        triggerConfiguration:
          $ref: "#/components/schemas/EventTriggerConfig"
    EventTriggerRequest:
      type: "object"
      properties:
        isActive:
          type: "boolean"
        triggerConfiguration:
          $ref: "#/components/schemas/EventTriggerConfig"
    EventType:
      title: "EventType"
      type: "string"
      enum:
      - "events"
      - "bizevents"
      - "dt.system.events"
      - "security.events"
      description: "Grail event type."
    ExecuteQueryAsActorRequest:
      type: "object"
      properties:
        actor:
          type: "string"
          nullable: true
          minLength: 1
        filterQuery:
          type: "string"
          minLength: 1
      required:
      - "filterQuery"
    Execution:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        workflow:
          type: "string"
          format: "uuid"
          description: "Executed Workflow"
        state:
          $ref: "#/components/schemas/State"
        stateInfo:
          type: "string"
          nullable: true
        input:
          type: "object"
          additionalProperties: {}
        providedInput:
          type: "object"
          additionalProperties: {}
          nullable: true
        params:
          type: "object"
          additionalProperties: {}
        startedAt:
          type: "string"
          format: "date-time"
        endedAt:
          type: "string"
          format: "date-time"
          nullable: true
        runtime:
          type: "integer"
          description: "Calculate the runtime of an execution in seconds.\nIf the\
            \ execution is not ended, runtime is calculated until now."
          readOnly: true
        trigger:
          type: "string"
          nullable: true
          maxLength: 255
        schedule:
          type: "string"
          format: "uuid"
          nullable: true
        eventTrigger:
          type: "string"
          format: "uuid"
          nullable: true
        user:
          type: "string"
          nullable: true
          maxLength: 50
        actor:
          type: "string"
          readOnly: true
          maxLength: 36
        title:
          type: "string"
          readOnly: true
        result: {}
        triggerType:
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/ExecutionTriggerType"
        workflowVersion:
          type: "integer"
          minimum: 0
          readOnly: true
          nullable: true
        workflowType:
          readOnly: true
          anyOf:
          - $ref: "#/components/schemas/WorkflowType"
        triggerTypeDetail:
          $ref: "#/components/schemas/TriggerTypeDetail"
        parentExecution:
          type: "string"
          format: "uuid"
          readOnly: true
          nullable: true
        parentTaskName:
          type: "string"
          readOnly: true
          nullable: true
          description: "Parent task execution's name (subworkflows only)"
        rootExecution:
          type: "string"
          format: "uuid"
          nullable: true
        rootWorkflow:
          type: "string"
          format: "uuid"
          nullable: true
        isDraft:
          type: "boolean"
      required:
      - "actor"
      - "parentExecution"
      - "parentTaskName"
      - "runtime"
      - "state"
      - "title"
      - "triggerType"
      - "workflow"
      - "workflowType"
      - "workflowVersion"
      - "id"
    ExecutionInputsRequest:
      description: "Inputs for workflow executions"
      properties:
        input:
          additionalProperties: true
          default: {}
          description: "Inputs (key/value pairs)"
          type: "object"
        params:
          additionalProperties: true
          default: {}
          description: "Metadata (can be nested object)"
          type: "object"
        uniqueQualifier:
          description: "A qualifier that must not have been used before to trigger\
            \ the execution"
          nullable: true
          type: "string"
      title: "ExecutionInputsRequest"
      type: "object"
    ExecutionLimits:
      properties:
        hourlyExecutionUpperBoundStandard:
          type: "integer"
        hourlyExecutionUpperBoundSimple:
          type: "integer"
        hourlyExecutionDefaultStandard:
          type: "integer"
        hourlyExecutionDefaultSimple:
          type: "integer"
        hourlyEventTriggerStandard:
          type: "integer"
        hourlyEventTriggerSimple:
          type: "integer"
      required:
      - "hourlyExecutionUpperBoundStandard"
      - "hourlyExecutionUpperBoundSimple"
      - "hourlyExecutionDefaultStandard"
      - "hourlyExecutionDefaultSimple"
      - "hourlyEventTriggerStandard"
      - "hourlyEventTriggerSimple"
      title: "ExecutionLimits"
      type: "object"
    ExecutionTriggerType:
      enum:
      - "Manual"
      - "Schedule"
      - "Event"
      - "Workflow"
      type: "string"
    ExpressionPreviewRequest:
      type: "object"
      properties:
        expression:
          type: "string"
          minLength: 1
          description: "jinja expression"
        task:
          type: "string"
          minLength: 1
          description: "task name"
        workflow:
          description: "workflow definition"
          anyOf:
          - $ref: "#/components/schemas/WorkflowCreate"
        params:
          type: "object"
          additionalProperties: {}
          description: "execution params used to provide the event payload when previewing\
            \ event()"
        acceptsDictOrArray:
          type: "boolean"
          description: "Set to true to validate the workflow result is a dict or list"
      required:
      - "expression"
      - "workflow"
    ExpressionPreviewResponse:
      type: "object"
      properties:
        valid:
          type: "boolean"
        value: {}
        error:
          type: "object"
          additionalProperties: {}
      required:
      - "valid"
    FixedOffsetRule:
      properties:
        rule:
          format: "uuid4"
          type: "string"
        offset:
          description: "Offset days"
          type: "number"
      required:
      - "rule"
      - "offset"
      title: "FixedOffsetRule"
      type: "object"
    FixedOffsetRulePreviewRequest:
      properties:
        id:
          format: "uuid4"
          nullable: true
          type: "string"
        count:
          default: 10
          maximum: 10
          minimum: 0
          type: "integer"
        businessCalendar:
          format: "uuid4"
          nullable: true
          type: "string"
        dateFrom:
          description: "Start date for the preview range (yyyy-mm-dd). Defaults to\
            \ UTC today."
          nullable: true
          type: "string"
        dateTo:
          description: "End date for the preview range (yyyy-mm-dd). If provided,\
            \ returns all executions in the range and count is ignored. Must not exceed\
            \ 182 days from date_from."
          nullable: true
          type: "string"
        ruleType:
          $ref: "#/components/schemas/FixedOffsetRulePreviewRuleType"
        fixedOffsetRule:
          $ref: "#/components/schemas/FixedOffsetRule"
      required:
      - "ruleType"
      - "fixedOffsetRule"
      title: "FixedOffsetRulePreviewRequest"
      type: "object"
    FixedOffsetRulePreviewRuleType:
      enum:
      - "fixed_offset"
      type: "string"
    Freq:
      enum:
      - "YEARLY"
      - "MONTHLY"
      - "WEEKLY"
      - "DAILY"
      - "HOURLY"
      - "MINUTELY"
      - "SECONDLY"
      type: "string"
    GroupingRule:
      properties:
        combine:
          items:
            format: "uuid4"
            type: "string"
          nullable: true
          type: "array"
        intersect:
          items:
            format: "uuid4"
            type: "string"
          nullable: true
          type: "array"
        subtract:
          items:
            format: "uuid4"
            type: "string"
          nullable: true
          type: "array"
      title: "GroupingRule"
      type: "object"
    GroupingRulePreviewRequest:
      properties:
        id:
          format: "uuid4"
          nullable: true
          type: "string"
        count:
          default: 10
          maximum: 10
          minimum: 0
          type: "integer"
        businessCalendar:
          format: "uuid4"
          nullable: true
          type: "string"
        dateFrom:
          description: "Start date for the preview range (yyyy-mm-dd). Defaults to\
            \ UTC today."
          nullable: true
          type: "string"
        dateTo:
          description: "End date for the preview range (yyyy-mm-dd). If provided,\
            \ returns all executions in the range and count is ignored. Must not exceed\
            \ 182 days from date_from."
          nullable: true
          type: "string"
        ruleType:
          $ref: "#/components/schemas/GroupingRulePreviewRuleType"
        groupingRule:
          $ref: "#/components/schemas/GroupingRule"
      required:
      - "ruleType"
      - "groupingRule"
      title: "GroupingRulePreviewRequest"
      type: "object"
    GroupingRulePreviewRuleType:
      enum:
      - "grouping"
      type: "string"
    Holiday:
      properties:
        title:
          type: "string"
        date:
          type: "string"
      required:
      - "title"
      - "date"
      title: "Holiday"
      type: "object"
    HolidayCalendarList:
      properties:
        count:
          type: "integer"
        results:
          items:
            $ref: "#/components/schemas/Holiday"
          type: "array"
      required:
      - "count"
      - "results"
      title: "HolidayCalendarList"
      type: "object"
    IntervalTrigger:
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/IntervalTriggerType"
        intervalMinutes:
          maximum: 720
          minimum: 1
          type: "integer"
        betweenStart:
          nullable: true
          pattern: "^([0-1]\\d|2[0-3]):[0-5]\\d$"
          type: "string"
        betweenEnd:
          nullable: true
          pattern: "^([0-1]\\d|2[0-3]):[0-5]\\d$"
          type: "string"
      required:
      - "type"
      - "intervalMinutes"
      title: "IntervalTrigger"
      type: "object"
    IntervalTriggerType:
      enum:
      - "interval"
      type: "string"
    MaintenanceWindowTriggerBehaviorType:
      title: "MaintenanceWindowTriggerBehaviorType"
      type: "string"
      enum:
      - "always"
      - "inside"
      - "outside"
      description: "Specifies when to trigger based on maintenance window status."
    ModificationInfo:
      properties:
        createdBy:
          format: "uuid"
          nullable: true
          type: "string"
        createdTime:
          format: "date-time"
          type: "string"
        lastModifiedBy:
          format: "uuid"
          nullable: true
          type: "string"
        lastModifiedTime:
          format: "date-time"
          type: "string"
      required:
      - "createdBy"
      - "createdTime"
      - "lastModifiedBy"
      - "lastModifiedTime"
      title: "ModificationInfo"
      type: "object"
    OnceTrigger:
      additionalProperties: false
      properties:
        type:
          $ref: "#/components/schemas/OnceTriggerType"
        at:
          description: "Datetime in ISO 8601 format without timezone information."
          example: "2025-12-25T14:30:00"
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$"
          type: "string"
      required:
      - "type"
      - "at"
      title: "OnceTrigger"
      type: "object"
    OnceTriggerType:
      enum:
      - "once"
      type: "string"
    OwnerType:
      enum:
      - "USER"
      - "GROUP"
      type: "string"
    PaginatedWorkflowMinimalList:
      type: "object"
      required:
      - "count"
      - "results"
      properties:
        count:
          type: "integer"
          example: 123
        results:
          type: "array"
          items:
            $ref: "#/components/schemas/WorkflowMinimal"
    QueryResult:
      description: "Response model for DQL query execution."
      properties:
        results:
          default: []
          items:
            additionalProperties: true
            type: "object"
          type: "array"
      title: "QueryResult"
      type: "object"
    RRule:
      properties:
        freq:
          $ref: "#/components/schemas/Freq"
        datestart:
          description: "The recurrence start."
          type: "string"
        interval:
          default: 1
          description: "The interval between each freq iteration."
          minimum: 0
          type: "integer"
        wkst:
          description: "The week start day."
          nullable: true
          anyOf:
          - $ref: "#/components/schemas/Wkst"
        until:
          description: "Specifying the upper-bound limit of the recurrence."
          format: "date-time"
          nullable: true
          type: "string"
        bysetpos:
          description: "Each given integer will specify an occurrence number, corresponding\
            \ to the nth occurrence of the rule inside the frequency period"
          items:
            type: "integer"
          nullable: true
          type: "array"
        bymonth:
          description: "The months to apply the recurrence to."
          items:
            type: "integer"
          nullable: true
          type: "array"
        bymonthday:
          description: "The month days to apply the recurrence to."
          items:
            type: "integer"
          nullable: true
          type: "array"
        byyearday:

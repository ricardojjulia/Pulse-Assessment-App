          type: "string"
          format: "uuid"
        ownerType:
          $ref: "#/components/schemas/OwnerType"
        isPrivate:
          type: "boolean"
          default: true
        schemaVersion:
          type: "integer"
          maximum: 2147483647
          minimum: -2147483648
        trigger:
          $ref: "#/components/schemas/TriggerRequest"
        result:
          type: "string"
          nullable: true
        type:
          description: "Workflow type."
          anyOf:
          - $ref: "#/components/schemas/WorkflowType"
        input:
          type: "object"
          additionalProperties: {}
        hourlyExecutionLimit:
          type: "integer"
          maximum: 2147483647
          minimum: 1
          nullable: true
          default: 1000
        guide:
          type: "string"
          nullable: true
          maxLength: 10000

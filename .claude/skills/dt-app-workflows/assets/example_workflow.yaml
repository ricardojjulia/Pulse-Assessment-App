title: Kubernetes Troubleshooting Agent
description: Kubernetes troubleshooting agent workflow which uses Dynatrace Intelligence to analyse Kubernetes incidences and provides fixes
actor: 26***a46-****-4ad3-****-f85824***7d3
owner: 26***a46-c8ed-****-****-f85824***7d3
ownerType: USER
isPrivate: false
schemaVersion: 4
trigger:
  eventTrigger:
    isActive: true
    triggerConfiguration:
      type: davis-event
      value:
        entityTags: {}
        customFilter: |
          event.status_transition == "CREATED"
          AND event.provider == "KUBERNETES_ANOMALY_DETECTION"
          AND dt.openpipeline.source != "classic_rest_api"
          AND (k8s.namespace.name == "easytrade" OR k8s.namespace.name == "astroshop")
        onProblemClose: false
        maintenanceWindowTriggerBehavior: always
        entityTagsMatch: null
result: null
type: STANDARD
input:
  actions:
    generatePullRequest: false
    generateRecommendation: true
hourlyExecutionLimit: 10
guide: |-
  # Kubernetes Troubleshooting Agent
  This workflow integrates agentic AI into your Kubernetes environment, providing instant diagnostics directly within the Problems app.

  # How to Set Up
  Deploy this workflow, and it will automatically trigger a diagnostic process for every new K8s issue. The results will be available in the Problems app within minutes, giving you actionable insights effortlessly.

  ## Configuration

  When importing the workflow, you can configure two variables:

  1. **`generateRecommendation`**:
     - **Default**: `true`
     - When set to `true`, the workflow automatically enriches any Kubernetes problem with the output from the agent.

  2. **`generatePullRequest`**:
     - **Default**: `false`
     - When set to `true`, the workflow extracts the YAML from the agent's suggestions and creates a pull request with the changes.
     - **Note**: To enable this functionality, the `create_pull_request_1` step must be properly configured with your Git repository.
tasks:
  create_event:
    name: create_event
    input:
      script: |-
        // optional import of sdk modules
        import { execution } from '@dynatrace-sdk/automation-utils';
        import { eventsClient } from "@dynatrace-sdk/client-classic-environment-v2";

        export default async function () {
          // your code goes here
          // e.g. get the current execution
          const ex = await execution();
          const input = ex.input
          const event = await ex.result("js_format_properties");
          console.log("Event: " + event);
          const data = await eventsClient.createEvent({
          body: event,
        });
          console.log(data);
          if (data.eventIngestResults[0].status !== "OK") {
            throw new Error("Event ingest failed! See logs!");
          }
          return data;
        }
    action: dynatrace.automations:run-javascript
    position:
      x: 0
      "y": 5
    conditions:
      states:
        js_format_properties: OK
    description: Run custom JavaScript code.
    predecessors:
      - js_format_properties
  dql_cpu_metric:
    name: dql_cpu_metric
    input:
      query: |-
        timeseries result = sum(dt.kubernetes.container.cpu_usage, default: 0, rollup: sum, rate: 1m), nonempty: true, by:{ {{event()["affected_entity_types"][0]}} }, filter:  {{event()["affected_entity_types"][0]}}  == "{{event()["affected_entity_ids"][0] }}", interval:1h | fieldsAdd metricName = "Kubernetes: Container - CPU usage"
        | append[timeseries result = sum(dt.kubernetes.container.cpu_throttled, default: 0, rollup: sum, rate: 1m), nonempty: true, by:{dt.entity.cloud_application}, filter:  {{event()["affected_entity_types"][0]}} == "{{event()["affected_entity_ids"][0] }}", interval:1h | fieldsAdd metricName = "Kubernetes: Container - CPU throttled"]
        | append[timeseries result = sum(dt.kubernetes.container.requests_cpu, rollup: sum, rate: 1m), by:{ {{event()["affected_entity_types"][0]}} }, filter: dt.entity.cloud_application == "{{event()["affected_entity_ids"][0] }}", interval:1h| fieldsAdd metricName = "CPU requests"]
        | append[timeseries result = sum(dt.kubernetes.container.limits_cpu, rollup: sum, rate: 1m), by:{ {{event()["affected_entity_types"][0]}} }, filter: {{event()["affected_entity_types"][0]}} == "{{event()["affected_entity_ids"][0] }}", interval:1h | fieldsAdd metricName = "CPU limits"]
        | append[timeseries {
          subSeries = sum(dt.kubernetes.container.cpu_usage, rollup:sum, rate:1m),
          totalSeries = sum(dt.kubernetes.node.cpu_allocatable, rollup:sum, rate:1m)
        }, by:{ {{event()["affected_entity_types"][0]}} }, filter: {{event()["affected_entity_types"][0]}} == "{{event()["affected_entity_ids"][0] }}" | fieldsAdd result = (subSeries[] / totalSeries[]) * 100
        | fieldsRemove subSeries, totalSeries | fieldsAdd metricName = "Kubernetes: Container - CPU usage %"]
        | append[timeseries {
          subSeries = sum(dt.kubernetes.container.requests_cpu, rollup:sum, rate:1m),
          totalSeries = sum(dt.kubernetes.node.cpu_allocatable, rollup:sum, rate:1m)
        }, by:{ {{event()["affected_entity_types"][0]}} }, filter: {{event()["affected_entity_types"][0]}} == "{{event()["affected_entity_ids"][0] }}" | fieldsAdd result = (subSeries[] / totalSeries[]) * 100
        | fieldsRemove subSeries, totalSeries | fieldsAdd metricName = "Kubernetes: Container - CPU requests %"]
        | append[timeseries {
          subSeries = sum(dt.kubernetes.container.limits_cpu, rollup:sum, rate:1m),
          totalSeries = sum(dt.kubernetes.node.cpu_allocatable, rollup:sum, rate:1m)
        }, by:{ {{event()["affected_entity_types"][0]}} }, filter:  {{event()["affected_entity_types"][0]}}  == "{{event()["affected_entity_ids"][0] }}" | fieldsAdd result = (subSeries[] / totalSeries[]) * 100
        | fieldsRemove subSeries, totalSeries | fieldsAdd metricName = "Kubernetes: Container - CPU limits %"]
    action: dynatrace.automations:execute-dql-query
    position:
      x: -2
      "y": 1
    conditions:
      states: {}
    description: Make use of Dynatrace Grail data in your workflow.
    predecessors: []
  js_extract_yaml:
    name: js_extract_yaml
    input:
      script: |
        import { execution } from "@dynatrace-sdk/automation-utils";

        export default async function ({ executionId }) {
          const exe = await execution(executionId);
          const davis_prompt_result = await exe.result("prompt_davis_copilot");

          const text: string = davis_prompt_result?.text ?? "";

          const extractYamlBlock = (input: string): string | null => {
            // 1) Prefer explicitly labeled YAML fences
            const m1 = input.match(/```(?:yaml|yml)\s*([\s\S]*?)\s*```/i);
            if (m1?.[1]?.trim()) return m1[1].trim();

            // 2) Fallback: first fenced code block of any language
            const m2 = input.match(/```[a-zA-Z0-9_-]*\s*([\s\S]*?)\s*```/);
            if (m2?.[1]?.trim()) return m2[1].trim();

            return null;
          };

          const yamlText = extractYamlBlock(text);

          return {
            yamlFound: Boolean(yamlText),
            yamlText: yamlText, // null if not found
          };
        }
    action: dynatrace.automations:run-javascript
    position:
      x: 1
      "y": 4
    conditions:
      custom: ""
      states:
        prompt_davis_copilot: OK
    description: Run custom JavaScript code.
    predecessors:
      - prompt_davis_copilot

  dql_query_get_logs:
    name: dql_query_get_logs
    input:
      query: |-
        fetch logs, from: now()-10min
        | filter {% if "k8s.cluster.name" in event() %}k8s.cluster.name == "{{ event()['k8s.cluster.name'] }}"{% else %}true == true{% endif %}
        | filter {% if "k8s.node.name" in event() %}k8s.node.name == "{{ event()['k8s.node.name'] }}"{% else %}true == true{% endif %}
        | filter {% if "k8s.namespace.name" in event() %}k8s.namespace.name == "{{ event()['k8s.namespace.name'] }}"{% else %}true == true{% endif %}
        | filter {% if "k8s.workload.name" in event() %}k8s.workload.name == "{{ event()['k8s.workload.name'] }}"{% else %}true == true{% endif %}
        | filter contains(lower(content), "error") OR contains(lower(content), "exception") OR loglevel == "ERROR" OR loglevel == "WARN" OR loglevel == "EMERGENCY"
        | fields timestamp, content
        | limit 10
      timezone: Europe/Berlin
    action: dynatrace.automations:execute-dql-query
    position:
      x: 0
      "y": 1
    conditions:
      states: {}
    description: Make use of Dynatrace Grail data in your workflow.
    predecessors: []
  dql_related_events:
    name: dql_related_events
    input:
      query: |
        fetch events, from: now()-90min
          | filter dt.system.bucket == "default_davis_custom_events" or dt.system.bucket == "default_davis_events" or dt.system.bucket == "default_davis_k8s_ops_events"
          | filter event.kind == "DAVIS_EVENT"
          | filter event.provider == "KUBERNETES_EVENT" or
            (event.provider == "KUBERNETES_INFERRED_EVENT" and event.group_label != "Workload spec change")
          | filter {% if "k8s.cluster.name" in event() %}k8s.cluster.name == "{{ event()['k8s.cluster.name'] }}"{% else %}true == true{% endif %}

          | filter {% if "k8s.node.name" in event() %}k8s.node.name == "{{ event()['k8s.node.name'] }}"{% else %}true == true{% endif %}

          | filter {% if "k8s.namespace.name" in event() %}k8s.namespace.name == "{{ event()['k8s.namespace.name'] }}"{% else %}true == true{% endif %}

          | filter {% if "k8s.workload.name" in event() %}k8s.workload.name == "{{ event()['k8s.workload.name'] }}"{% else %}true == true{% endif %}

          | sort event.start desc
          | summarize {
            first_seen = takeLast(event.start),
            occurrence = count()
          }, by: {event.category, dt.kubernetes.event.message, dt.kubernetes.event.reason, k8s.cluster.name, k8s.node.name, k8s.namespace.name, k8s.workload.name}
          | fields first_seen, occurrence, type=event.category, reason=dt.kubernetes.event.reason, message=dt.kubernetes.event.message, k8s.cluster.name, k8s.node.name, k8s.namespace.name, k8s.workload.name
    action: dynatrace.automations:execute-dql-query
    position:
      x: 1
      "y": 1
    conditions:
      states: {}
    description: Make use of Dynatrace Grail data in your workflow.
    predecessors: []

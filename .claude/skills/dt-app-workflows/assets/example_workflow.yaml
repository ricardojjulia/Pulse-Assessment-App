  js_format_properties:
    name: js_format_properties
    input:
      script: |

        import { execution } from "@dynatrace-sdk/automation-utils";
        import { eventsClient, EventIngestEventType } from "@dynatrace-sdk/client-classic-environment-v2";

        export default async function ({ executionId }) {
          const exe = await execution(executionId);
          const davis_prompt_result = await exe.result("prompt_davis_copilot");
          const event = exe.params.event;

          const getFirstValue = (key: string) => {
            const value = event[key];
            return Array.isArray(value) ? value.find(v => v != null) : value;
          };

          const cloudAppId = getFirstValue("affected_entity_ids");
          const event_id = getFirstValue("event.id");
          const event_type = getFirstValue("event.type");
          const event_start_time = new Date(getFirstValue("event.start"));

          let davisPrompt = davis_prompt_result.text;
          if (davisPrompt.length > 4096) {
            davisPrompt = davisPrompt.slice(0, 4096);
          }

          return {
          title: "✨ Dynatrace Intelligence",
          eventType: event_type || "AVAILABILITY_EVENT",
          entitySelector: 'entityId("' + getFirstValue("dt.source_entity") + '")',
          startTime: event_start_time.getTime(),
          properties: {
            "event.category": getFirstValue("event.category"),
            "event.kind": getFirstValue("event.kind"),
            "event.name": "✨ Dynatrace Intelligence for K8s",
            "event.description": davisPrompt,
            "dt.event.allow_davis_merge": true,
            "dt.event.is_rootcause_relevant": true,
            "k8s.namespace.name": getFirstValue("k8s.namespace.name"),
            "k8s.cluster.name": getFirstValue("k8s.cluster.name"),
            "k8s.node.name": getFirstValue("k8s.node.name"),
            "k8s.cluster.uid": getFirstValue("k8s.cluster.uid"),
            "k8s.workload.name": getFirstValue("k8s.workload.name"),
            "k8s.workload.kind": getFirstValue("k8s.workload.kind"),
            "dt.source_entity": getFirstValue("dt.source_entity"),
            "dt.source_entity.type": getFirstValue("dt.source_entity.type"),
            "source": getFirstValue("source"),
            "event.provider": getFirstValue("event.provider")
          }
        };

        }
    action: dynatrace.automations:run-javascript
    position:
      x: 0
      "y": 4
    conditions:
      custom: "{{ input()[\"actions\"][\"generateRecommendation\"] }}"
      states:
        prompt_davis_copilot: OK
    description: Run custom JavaScript code.
    predecessors:
      - prompt_davis_copilot
  prompt_davis_copilot:
    name: prompt_davis_copilot
    input:
      config: dynatrace
      prompt: |-
        Dynatrace has detected the following Kubernetes issue. Please help me troubleshooting it.
        Problem Description: {{ event()["event.description"]}}
        Timestamp: {{event()["timestamp"]}}

        Consider the issue only as the trigger and look at all additional context provided to figure out the actuall problem and root-cause.

        Related events of the same workload, related metrics, workload yaml files, change_details and logs are found in the context/supplementary.

        I want to know the underlying root-cause based on the logs, related events, workload details and yaml file. Call out the specific anomalies/misconfigurations/failure patterns. Explain the root-cause in a simple sentence, followed by supporting findings. Mention which side effects are triggered because of this and why. Also mention what things you checked, but didn't contain any related error signals.

        I also want to know a specific solution. If needed, show an updated yaml file that fixes the issue.
      autoTrim: true
      instruction: ""
      supplementary: |
        # YAML definition
        {{ result("dql_query_for_smartscape_yaml")["records"] if result("dql_query_for_smartscape_yaml") is mapping and "records" in result("dql_query_for_smartscape_yaml") else None }}

        # Recent spec changes
        {{ result("dql_query_spec_changes")["records"] if result("dql_query_spec_changes") is mapping and "records" in result("dql_query_spec_changes") else None }}

        # Related logs
        {{ result("dql_query_get_logs")["records"] if result("dql_query_get_logs") is mapping and "records" in result("dql_query_get_logs") else None }}

        # Related Dynatrace problems
        {{ result("dql_related_health_alerts")["records"] if result("dql_related_health_alerts") is mapping and "records" in result("dql_related_health_alerts") else None }}

        # Summary of related kubernetes events:
        {{ result("dql_related_events")["records"] if result("dql_related_events") is mapping and "records" in result("dql_related_events") else None }}

        # Related metrics
        ## CPU
        {{ result("dql_cpu_metric")["records"] | replace(" ", "") if result("dql_cpu_metric") is mapping and "records" in result("dql_cpu_metric") else None }}
        ## Memory
        {{ result("dql_memory_metrics")["records"] | replace(" ", "") if result("dql_memory_metrics") is mapping and "records" in result("dql_memory_metrics") else None }}
        ## Metric related to triggering problem
        {{ result("dql_problem_metrics")["records"] | replace(" ", "") if result("dql_problem_metrics") is mapping and "records" in result("dql_problem_metrics") else None }}
    action: dynatrace.davis.copilot.workflow.actions:davis-copilot
    position:
      x: 0
      "y": 3
    conditions:
      states:
        dql_cpu_metric: OK
        dql_memory_metrics: OK
        dql_query_get_logs: OK
        dql_related_events: ANY
        dql_problem_metrics: ANY
        dql_query_spec_changes: OK
        dql_related_health_alerts: OK
        dql_query_for_smartscape_yaml: OK
    description: Prompt the Dynatrace Intelligence generative AI
    predecessors:
      - dql_query_for_smartscape_yaml
      - dql_query_get_logs
      - dql_cpu_metric
      - dql_memory_metrics
      - dql_problem_metrics
      - dql_related_events

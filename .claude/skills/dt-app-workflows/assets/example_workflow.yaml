        }, by:{ {{event()["affected_entity_types"][0]}} }, filter:  {{event()["affected_entity_types"][0]}}  == "{{event()["affected_entity_ids"][0] }}" | fieldsAdd result = (subSeries[] / totalSeries[]) * 100
        | fieldsRemove subSeries, totalSeries | fieldsAdd metricName = "Kubernetes: Container - memory limits %"]
    action: dynatrace.automations:execute-dql-query
    position:
      x: -1
      "y": 1
    conditions:
      states: {}
    description: Make use of Dynatrace Grail data in your workflow.

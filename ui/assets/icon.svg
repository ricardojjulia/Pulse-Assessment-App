<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14C8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00C39B" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="textG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14C8FF"/>
      <stop offset="45%" stop-color="#48D1CC"/>
      <stop offset="100%" stop-color="#80FFEA"/>
    </linearGradient>
    <linearGradient id="globeRingG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1464FF"/>
      <stop offset="100%" stop-color="#00C39B"/>
    </linearGradient>
    <radialGradient id="globeFill" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#1A3A8A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0B1628" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="centerNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14C8FF"/>
      <stop offset="100%" stop-color="#1464FF"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="globeClip">
      <circle cx="64" cy="54" r="32"/>
    </clipPath>
  </defs>

  <!-- Background frame -->
  <rect x="6" y="6" width="116" height="116" rx="18" ry="18"
    fill="none" stroke="url(#frameG)" stroke-width="1.8" opacity="0.85"/>
  <rect x="9" y="9" width="110" height="110" rx="15" ry="15"
    fill="#0B1628"/>
  <rect x="9" y="9" width="110" height="110" rx="15" ry="15"
    fill="none" stroke="#14C8FF" stroke-width="0.3" opacity="0.12"/>

  <!-- Ambient glow behind globe -->
  <circle cx="64" cy="54" r="38" fill="#1464FF" opacity="0.07"/>

  <!-- Globe interior fill -->
  <circle cx="64" cy="54" r="32" fill="url(#globeFill)"/>

  <!-- Globe grid lines (clipped to sphere) -->
  <g clip-path="url(#globeClip)" stroke="#14C8FF" fill="none" opacity="0.38" stroke-width="0.65">
    <!-- Equator -->
    <ellipse cx="64" cy="54" rx="32" ry="10"/>
    <!-- Upper latitude -->
    <ellipse cx="64" cy="43" rx="24" ry="7.5"/>
    <!-- Lower latitude -->
    <ellipse cx="64" cy="65" rx="24" ry="7.5"/>
    <!-- Center meridian (vertical) -->
    <line x1="64" y1="22" x2="64" y2="86"/>
    <!-- Left meridian -->
    <path d="M64,22 C44,31 44,77 64,86"/>
    <!-- Right meridian -->
    <path d="M64,22 C84,31 84,77 64,86"/>
  </g>

  <!-- Globe outline ring -->
  <circle cx="64" cy="54" r="32" fill="none" stroke="url(#globeRingG)" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Monitoring nodes at geographic intersections -->
  <!-- North pole -->
  <circle cx="64" cy="24" r="2.8" fill="#14C8FF" opacity="0.95" filter="url(#glow)"/>
  <!-- Left equator -->
  <circle cx="32" cy="54" r="2.2" fill="#00C39B" opacity="0.9" filter="url(#glow)"/>
  <!-- Right equator -->
  <circle cx="96" cy="54" r="2.2" fill="#00C39B" opacity="0.9" filter="url(#glow)"/>
  <!-- Upper-left lat/long intersection -->
  <circle cx="42" cy="40" r="1.9" fill="#6488FF" opacity="0.95" filter="url(#glowSoft)"/>
  <!-- Upper-right lat/long intersection -->
  <circle cx="86" cy="40" r="1.9" fill="#6488FF" opacity="0.95" filter="url(#glowSoft)"/>
  <!-- South pole -->
  <circle cx="64" cy="84" r="2.2" fill="#14C8FF" opacity="0.75" filter="url(#glowSoft)"/>
  <!-- Center node (focal point) -->
  <circle cx="64" cy="54" r="5" fill="url(#centerNode)" opacity="0.25"/>
  <circle cx="64" cy="54" r="3" fill="url(#centerNode)" opacity="0.9" filter="url(#glow)"/>

  <!-- Connection arcs between nodes (outside globe for depth) -->
  <g stroke="#14C8FF" stroke-width="0.55" opacity="0.22" fill="none">
    <line x1="64" y1="24" x2="42" y2="40"/>
    <line x1="64" y1="24" x2="86" y2="40"/>
    <line x1="42" y1="40" x2="32" y2="54"/>
    <line x1="86" y1="40" x2="96" y2="54"/>
    <line x1="32" y1="54" x2="64" y2="84"/>
    <line x1="96" y1="54" x2="64" y2="84"/>
  </g>

  <!-- Subtle pulse ring around center node -->
  <circle cx="64" cy="54" r="9" fill="none" stroke="#14C8FF" stroke-width="0.6" opacity="0.3"/>
  <circle cx="64" cy="54" r="14" fill="none" stroke="#14C8FF" stroke-width="0.4" opacity="0.15"/>

  <!-- ATLAS wordmark -->
  <g filter="url(#glowStrong)">
    <text x="64" y="112"
      text-anchor="middle"
      font-family="Inter, Arial, Helvetica, sans-serif"
      font-size="17"
      font-weight="900"
      letter-spacing="4"
      fill="url(#textG)"
      opacity="0.97">ATLAS</text>
  </g>
  <!-- Underline rule -->
  <line x1="28" y1="100" x2="100" y2="100" stroke="url(#textG)" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>

  <!-- Corner sparkles -->
  <g opacity="0.55" stroke="#FFFFFF" stroke-width="0.7" stroke-linecap="round">
    <line x1="20" y1="24" x2="20" y2="20"/>
    <line x1="18" y1="22" x2="22" y2="22"/>
    <line x1="108" y1="28" x2="108" y2="24"/>
    <line x1="106" y1="26" x2="110" y2="26"/>
  </g>

  <!-- Ambient particles -->
  <g fill="#14C8FF" opacity="0.32">
    <circle cx="14" cy="48" r="0.9"/>
    <circle cx="17" cy="75" r="0.65"/>
    <circle cx="114" cy="42" r="0.75"/>
    <circle cx="112" cy="80" r="0.65"/>
    <circle cx="22" cy="98" r="0.7"/>
    <circle cx="106" cy="16" r="0.65"/>
    <circle cx="52" cy="15" r="0.6"/>
    <circle cx="76" cy="15" r="0.6"/>
  </g>
</svg>
